<dialog id="service-dialog" class="module-dialog service-dialog" aria-labelledby="service-dialog-title">
  <span class="module-dialog-icon"><i class="bi bi-folder2-open" aria-hidden="true"></i></span>
  <h2 id="service-dialog-title">¿EN QUÉ SERVICIO DESEA GUARDAR ESTE REGISTRO?</h2>
  <form method="dialog" id="service-confirmation">
    <label class="form-label" for="service-confirm-choice">Servicio hospitalario</label>
    <select id="service-confirm-choice" class="form-control" required><option value="">Selecciona un servicio</option></select>
    <div class="form-actions"><button class="btn btn-primary" type="submit">CONFIRMAR Y GUARDAR</button><button class="btn admin-secondary" type="button" id="service-cancel">CANCELAR</button></div>
  </form>
</dialog>
