<header class="app-header"><button class="mobile-menu" id="menu-toggle" aria-label="Abrir menú" aria-controls="sidebar" aria-expanded="false"><i class="bi bi-list" aria-hidden="true"></i></button><div class="header-identity"><strong>DEPARTAMENTO DE ENFERMERÍA</strong><span>Hospital Regional CDE</span></div><details class="profile"><summary><span class="avatar">{{ current_user.username[0]|upper }}</span><span class="profile-text"><strong>{{ current_user.username }}</strong><small>{{ current_user.rol_nombre }}</small></span><i class="bi bi-chevron-down" aria-hidden="true"></i></summary><div class="profile-menu"><strong>{{ current_user.nombre }}</strong><p>{{ current_user.rol_nombre }}</p>{% if current_user.protegido %}<span class="protected-label"><i class="bi bi-shield-lock" aria-hidden="true"></i> Cuenta protegida</span>{% endif %}<a class="profile-password-link" href="{{ url_for('account_security.password') }}">Cambiar mi contraseña</a><form action="{{ url_for('auth.logout') }}" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button type="submit"><i class="bi bi-box-arrow-right" aria-hidden="true"></i> Cerrar sesión</button></form></div></details></header>
